display_message:
  name: Display message
  description: Send a message to a KEBA wallbox display.
  target:
    entity:
      domain: notify
      integration: keba_wallbox_modbus
  fields:
    message:
      name: Message
      description: Text shown on the wallbox display.
      required: true
      example: "PV charging active"
      selector:
        text:
    min_time:
      name: Minimum duration
      description: Minimum display duration in seconds. When omitted, the configured default is used.
      selector:
        number:
          min: 0
          max: 10
          mode: box
          unit_of_measurement: s
    max_time:
      name: Maximum duration
      description: Maximum display duration in seconds. When omitted, the configured default is used.
      selector:
        number:
          min: 0
          max: 10
          mode: box
          unit_of_measurement: s
